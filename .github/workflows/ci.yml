name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: make bootstrap
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: make check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-screenshots
          path: web/test-results/**/tailpath-topology.png
          if-no-files-found: ignore
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose delivery
        env:
          TAILPATH_AUTHKEY_FILE: /tmp/tailpath-production-authkey
        run: |
          install -m 444 /dev/null "$TAILPATH_AUTHKEY_FILE"
          install -m 600 /dev/null /tmp/tailpath-smoke-authkey
          production="$(docker compose -f compose.yaml config --format json)"
          jq -e '.services.server.environment.TS_AUTHKEY == "file:/run/secrets/tailscale-authkey"' <<<"$production"
          jq -e '.services.server.volumes as $volumes | ($volumes | length) == 1 and $volumes[0].type == "volume" and $volumes[0].source == "tailpath-data" and $volumes[0].target == "/var/lib/tailpath"' <<<"$production"
          jq -e '.services.server.secrets as $secrets | ($secrets | length) == 1 and $secrets[0].source == "tailscale-authkey" and $secrets[0].target == "/run/secrets/tailscale-authkey"' <<<"$production"
          docker compose -f compose.smoke.yaml config --quiet
          sh -n scripts/smoke.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: tailpath:test
          build-args: VERSION=ci
      - name: Validate image state volume
        run: |
          docker image inspect tailpath:test --format '{{json .Config.Volumes}}' \
            | jq -e '. == {"/var/lib/tailpath": {}}'
