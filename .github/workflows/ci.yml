name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: make bootstrap
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: make check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-screenshots
          path: web/test-results/**/tailpath-topology.png
          if-no-files-found: ignore
          retention-days: 14

  native-platforms:
    name: Native collector (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - run: go test ./...
      - run: go build ./cmd/tailpath
      - name: Validate POSIX packaging
        if: runner.os != 'Windows'
        run: |
          sh -n packaging/linux/*.sh packaging/darwin/*.sh packaging/tests/*.sh
      - name: Validate Linux installer fixtures
        if: runner.os == 'Linux'
        run: |
          packaging/tests/linux-installer.sh
          packaging/tests/darwin-installer.sh
      - name: Validate LaunchAgent
        if: runner.os == 'macOS'
        run: plutil -lint packaging/darwin/com.tailpath.collector.plist
      - name: Validate Windows packaging
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $Failed = $false
          Get-ChildItem packaging/windows/*.ps1,packaging/tests/windows-runner.ps1 | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )
            if ($Errors.Count -gt 0) {
              $Errors | ForEach-Object { Write-Host $_ }
              $Failed = $true
            }
          }
          if ($Failed) { exit 1 }
          $Fixture = Join-Path $env:RUNNER_TEMP "tailpath-fixture.exe"
          go build -o $Fixture ./packaging/tests/fake-collector
          & ./packaging/tests/windows-runner.ps1 -Binary $Fixture

  native-archives:
    name: Native collector archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean
      - run: packaging/tests/archive-layout.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-collector-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose delivery
        env:
          TAILPATH_AUTHKEY_FILE: /tmp/tailpath-production-authkey
        run: |
          install -m 444 /dev/null "$TAILPATH_AUTHKEY_FILE"
          install -m 600 /dev/null /tmp/tailpath-smoke-authkey
          production="$(docker compose -f compose.yaml config --format json)"
          jq -e '.services.server.environment.TS_AUTHKEY == "file:/run/secrets/tailscale-authkey"' <<<"$production"
          jq -e '.services.server.volumes as $volumes | ($volumes | length) == 1 and $volumes[0].type == "volume" and $volumes[0].source == "tailpath-data" and $volumes[0].target == "/var/lib/tailpath"' <<<"$production"
          jq -e '.services.server.secrets as $secrets | ($secrets | length) == 1 and $secrets[0].source == "tailscale-authkey" and $secrets[0].target == "/run/secrets/tailscale-authkey"' <<<"$production"
          docker compose -f compose.smoke.yaml config --quiet
          sh -n scripts/smoke.sh
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: tailpath:test
          build-args: VERSION=ci
      - name: Validate image state volume
        run: |
          docker image inspect tailpath:test --format '{{json .Config.Volumes}}' \
            | jq -e '. == {"/var/lib/tailpath": {}}'
