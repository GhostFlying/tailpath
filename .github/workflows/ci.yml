name: CI

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: make bootstrap
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: make check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-screenshots
          path: |
            web/test-results/**/tailpath-topology.png
            web/test-results/**/tailpath-sparse-entry.png
            web/test-results/**/history-15m-empty.png
            web/test-results/**/mobile-tabs-*.png
            web/test-results/**/history-mobile-metadata.png
            web/test-results/**/history-null-collections-*.png
            web/test-results/**/tailpath-runtime-status-*.png
            web/test-results/**/tailpath-control-traffic.png
            web/test-results/**/relay-platform-icon-*.png
          if-no-files-found: ignore
          retention-days: 14

  native-platforms:
    name: Native collector (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - run: go test ./...
      - run: go build ./cmd/tailpath
      - name: Validate POSIX packaging
        if: runner.os != 'Windows'
        run: |
          sh -n packaging/linux/*.sh packaging/darwin/*.sh packaging/tests/*.sh
      - name: Validate Linux installer fixtures
        if: runner.os == 'Linux'
        run: |
          packaging/tests/linux-installer.sh
          packaging/tests/darwin-installer.sh
      - name: Validate LaunchAgent
        if: runner.os == 'macOS'
        run: plutil -lint packaging/darwin/com.tailpath.collector.plist
      - name: Validate Windows packaging
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $Failed = $false
          Get-ChildItem packaging/windows/*.ps1,packaging/tests/windows-runner.ps1 | ForEach-Object {
            $Tokens = $null
            $Errors = $null
            [void][Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$Tokens,
              [ref]$Errors
            )
            if ($Errors.Count -gt 0) {
              $Errors | ForEach-Object { Write-Host $_ }
              $Failed = $true
            }
          }
          if ($Failed) { exit 1 }
          $Fixture = Join-Path $env:RUNNER_TEMP "tailpath-fixture.exe"
          go build -o $Fixture ./packaging/tests/fake-collector
          & ./packaging/tests/windows-runner.ps1 -Binary $Fixture

  native-archives:
    name: Native collector archives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean
      - run: packaging/tests/archive-layout.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: native-collector-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose delivery
        env:
          TAILPATH_AUTHKEY_FILE: /tmp/tailpath-production-authkey
          TAILPATH_DEVICES_OAUTH_CLIENT_SECRET_FILE: /tmp/tailpath-devices-oauth-secret.ci/secret
        run: |
          install -m 444 /dev/null "$TAILPATH_AUTHKEY_FILE"
          install -d -m 700 /tmp/tailpath-devices-oauth-secret.ci
          printf 'fixture-devices-secret' > "$TAILPATH_DEVICES_OAUTH_CLIENT_SECRET_FILE"
          chmod 444 "$TAILPATH_DEVICES_OAUTH_CLIENT_SECRET_FILE"
          install -d -m 700 /tmp/tailpath-exporter-dogfood-secret.ci
          install -m 600 /dev/null /tmp/tailpath-exporter-dogfood-secret.ci/authkey
          printf 'fixture-key' > /tmp/tailpath-exporter-dogfood-secret.ci/authkey
          chmod 444 /tmp/tailpath-exporter-dogfood-secret.ci/authkey
          production="$(docker compose -f compose.yaml config --format json)"
          jq -e '.services.server.environment.TS_AUTHKEY == "file:/run/secrets/tailscale-authkey"' <<<"$production"
          jq -e '.services.server.volumes as $volumes | ($volumes | length) == 1 and $volumes[0].type == "volume" and $volumes[0].source == "tailpath-data" and $volumes[0].target == "/var/lib/tailpath"' <<<"$production"
          jq -e '.services.server.secrets as $secrets | ($secrets | length) == 1 and $secrets[0].source == "tailscale-authkey" and $secrets[0].target == "/run/secrets/tailscale-authkey"' <<<"$production"
          devices="$(TAILPATH_DEVICES_OAUTH_CLIENT_ID=fixture-client TAILPATH_DEVICES_TAILNET=example.test docker compose -f compose.yaml -f compose.devices.yaml config --format json)"
          jq -e '.services.server.environment.TAILPATH_DEVICES_OAUTH_CLIENT_ID == "fixture-client" and .services.server.environment.TAILPATH_DEVICES_OAUTH_CLIENT_SECRET_FILE == "/run/secrets/tailscale-devices-oauth-client-secret" and .services.server.environment.TAILPATH_DEVICES_TAILNET == "example.test"' <<<"$devices"
          jq -e '.services.server.secrets | any(.source == "tailscale-devices-oauth-client-secret" and .target == "/run/secrets/tailscale-devices-oauth-client-secret")' <<<"$devices"
          ! grep -F 'fixture-devices-secret' <<<"$devices"
          docker compose -f compose.smoke.yaml config --quiet
          TAILPATH_VERSION=edge-0123456789abcdef0123456789abcdef01234567 \
            TAILPATH_EXPORTER_DOGFOOD_AUTHKEY_FILE=/tmp/tailpath-exporter-dogfood-secret.ci/authkey \
            docker compose -f compose.exporter-dogfood.yaml config --quiet
          mixed="$(TAILPATH_VERSION=edge-0123456789abcdef0123456789abcdef01234567 TAILPATH_SMOKE_ORDINARY_COLLECTOR_VERSION=0.2.0 docker compose -f compose.smoke.yaml config --format json)"
          jq -e '.services.server.image == "ghcr.io/ghostflying/tailpath:edge-0123456789abcdef0123456789abcdef01234567"' <<<"$mixed"
          jq -e '.services["collector-a"].image == "ghcr.io/ghostflying/tailpath:0.2.0" and .services["collector-b"].image == "ghcr.io/ghostflying/tailpath:0.2.0"' <<<"$mixed"
          jq -e '.services["collector-r"].image == "ghcr.io/ghostflying/tailpath:edge-0123456789abcdef0123456789abcdef01234567"' <<<"$mixed"
          sh -n scripts/smoke.sh
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: tailpath:test
          build-args: VERSION=ci
      - name: Validate image state volume
        run: |
          docker image inspect tailpath:test --format '{{json .Config.Volumes}}' \
            | jq -e '. == {"/var/lib/tailpath": {}}'
          set +e
          example_help="$(docker run --rm --entrypoint /usr/local/bin/tailpath-tsnet-multi tailpath:test --help 2>&1)"
          example_status=$?
          set -e
          test "$example_status" -eq 1
          grep -F 'Usage of tsnet-multi' <<<"$example_help"
          secret_value="$(docker run --rm --user 65532:65532 \
            -v /tmp/tailpath-exporter-dogfood-secret.ci/authkey:/run/secrets/authkey:ro \
            --entrypoint /bin/cat busybox:1.37.0 /run/secrets/authkey)"
          test "$secret_value" = fixture-key
          devices_secret_value="$(docker run --rm --user 65532:65532 \
            -v /tmp/tailpath-devices-oauth-secret.ci/secret:/run/secrets/devices-oauth:ro \
            --entrypoint /bin/cat busybox:1.37.0 /run/secrets/devices-oauth)"
          test "$devices_secret_value" = fixture-devices-secret
          state_volume="tailpath-image-state-${GITHUB_RUN_ID}"
          state_container="tailpath-image-state-${GITHUB_RUN_ID}"
          cleanup_state_gate() {
            docker rm -f "$state_container" >/dev/null 2>&1 || true
            docker volume rm "$state_volume" >/dev/null 2>&1 || true
          }
          trap cleanup_state_gate EXIT
          docker volume create "$state_volume" >/dev/null
          docker create --name "$state_container" \
            -v "$state_volume:/var/lib/tailpath" tailpath:test >/dev/null
          docker run --rm --user 65532:65532 --volumes-from "$state_container" \
            --entrypoint /bin/sh busybox:1.37.0 \
            -c 'mkdir -p /var/lib/tailpath/exporter && : > /var/lib/tailpath/exporter/write-probe'
          cleanup_state_gate
          trap - EXIT

  publish-edge:
    name: Publish immutable edge image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, native-platforms, native-archives, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve edge version
        id: version
        run: echo "value=edge-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/ghostflying/tailpath
          tags: type=raw,value=edge-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}

  promote-edge:
    name: Promote edge image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish-edge
    runs-on: ubuntu-latest
    concurrency:
      group: tailpath-edge-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve newest published main image
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWN_TAG: edge-${{ github.sha }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          owner_type="$(gh api "/users/$OWNER" --jq .type)"
          case "$owner_type" in
            Organization) package_path="/orgs/$OWNER/packages/container/tailpath/versions" ;;
            User) package_path="/users/$OWNER/packages/container/tailpath/versions" ;;
            *) echo "unsupported repository owner type: $owner_type" >&2; exit 1 ;;
          esac

          tags_file="$RUNNER_TEMP/edge-tags"
          for attempt in 1 2 3 4 5 6; do
            gh api --paginate "$package_path?per_page=100" \
              --jq '.[] | .metadata.container.tags[]?' > "$tags_file"
            if grep -Fxq "$OWN_TAG" "$tags_file"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "published tag $OWN_TAG was not visible through the package API" >&2
              exit 1
            fi
            sleep 5
          done

          tag="$(scripts/select-edge-tag.sh origin/main "$tags_file")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Move edge pointer
        env:
          SOURCE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          image=ghcr.io/ghostflying/tailpath
          docker buildx imagetools create \
            --tag "$image:edge" \
            "$image:$SOURCE_TAG"
          source_digest="$(docker buildx imagetools inspect "$image:$SOURCE_TAG" | awk '$1 == "Digest:" {print $2; exit}')"
          edge_digest="$(docker buildx imagetools inspect "$image:edge" | awk '$1 == "Digest:" {print $2; exit}')"
          test -n "$source_digest"
          test "$source_digest" = "$edge_digest"
          printf 'Promoted `%s@%s` to `edge`.\n' "$SOURCE_TAG" "$edge_digest" >> "$GITHUB_STEP_SUMMARY"
