name: V0.4 multi-runtime exporter scale gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0.4-exporter-scale-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.6
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: make bootstrap
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: make build
      - name: Run constrained ingest and API gate
        env:
          TAILPATH_PERF_DURATION: 10m
          TAILPATH_PERF_RPS: "125"
          TAILPATH_PERF_API_SAMPLES: "50"
          TAILPATH_PERF_OUTPUT_DIR: perf-artifacts
        run: ./scripts/perf-gate.sh
      - name: Record deterministic restart smoke
        run: |
          mkdir -p perf-artifacts
          /usr/bin/time -v \
            go test ./internal/fixtures \
              -run TestScaleScenarioAppIngestAndRestart \
              -count=1 -v -json -timeout=15m \
              > perf-artifacts/restart-smoke.json \
              2> perf-artifacts/restart-smoke-resource.txt
      - name: Enforce shared-reporter lifecycle and restart gate
        run: |
          /usr/bin/time -v \
            go test ./internal/fixtures \
              -run TestExporterScalePersistsWithdrawalAndReconnectAcrossRestart \
              -count=1 -v -json -timeout=15m \
              > perf-artifacts/exporter-scale.json \
              2> perf-artifacts/exporter-scale-resource.txt
      - name: Record 1,000-session relay restart and privacy smoke
        run: |
          /usr/bin/time -v \
            go test ./internal/fixtures \
              -run TestRelayScaleScenarioPersistsSanitizedHistoryAcrossRestart \
              -count=1 -v -json -timeout=15m \
              > perf-artifacts/relay-restart-smoke.json \
              2> perf-artifacts/relay-restart-smoke-resource.txt
      - name: Enforce seven-day history database size
        env:
          TAILPATH_HISTORY_SCALE: "1"
        run: |
          /usr/bin/time -v \
            go test ./internal/store \
              -run TestSevenDayHistoryDatabaseSize \
              -count=1 -v -json -timeout=15m \
              > perf-artifacts/history-size.json \
              2> perf-artifacts/history-size-resource.txt
      - name: Enforce browser scale gates
        env:
          TAILPATH_SCALE_E2E: "1"
          TAILPATH_E2E_STARTUP_ATTEMPTS: "180"
          TAILPATH_PLAYWRIGHT_OUTPUT_DIR: test-results/scale
        run: ./scripts/e2e.sh
      - name: Enforce Peer Relay browser scale gates
        env:
          TAILPATH_RELAY_SCALE_E2E: "1"
          TAILPATH_E2E_STARTUP_ATTEMPTS: "180"
          TAILPATH_PLAYWRIGHT_OUTPUT_DIR: test-results/relay-scale
        run: ./scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0.4-multi-runtime-exporter-scale-gate
          path: |
            perf-artifacts/
            web/test-results/scale/**/tailpath-scale.png
            web/test-results/scale/**/scale-browser.json
            web/test-results/relay-scale/**/tailpath-relay-scale.png
            web/test-results/relay-scale/**/relay-scale-browser.json
          if-no-files-found: warn
          retention-days: 30
