name: Layout browser gates

on:
  pull_request:
    paths:
      - 'web/**'
      - 'docs/layout-rules*'
      - '.devcontainer/**'
      - '.github/workflows/layout.yml'
      - 'scripts/e2e.sh'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: layout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_LAYOUT_DIAGNOSTICS: '1'
      TAILPATH_LAYOUT_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: make bootstrap
      - run: pnpm --dir web exec playwright install --with-deps chromium webkit
      - run: ./scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-layout-browser-evidence
          path: |
            web/test-results/**
            web/playwright-report/**
          retention-days: 14
