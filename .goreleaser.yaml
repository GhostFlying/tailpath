version: 2

project_name: tailpath

before:
  hooks:
    - go mod download

builds:
  - id: tailpath
    main: ./cmd/tailpath
    binary: tailpath
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  prerelease: auto
